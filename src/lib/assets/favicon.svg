<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="optC-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#0f111a" />
    </linearGradient>
    <linearGradient id="optC-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Tarjeta exterior -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#optC-bg)" stroke="#312e81" stroke-width="2" />

  <!-- Barra superior integrada con radio superior completo -->
  <rect x="20" y="22" width="88" height="16" rx="8" fill="url(#optC-bar)" />

  <!-- Anillas flotantes modernas -->
  <rect x="36" y="14" width="6" height="14" rx="3" fill="#ffffff" />
  <rect x="86" y="14" width="6" height="14" rx="3" fill="#ffffff" />

  <!-- Franja horizontal primaria (El evento principal del día) -->
  <rect x="20" y="46" width="88" height="16" rx="8" fill="#4f46e5" />

  <!-- Cuadrícula 2x2 modular inferior (Días / Bloques de enfoque) -->
  <rect x="20" y="70" width="40" height="16" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5" />
  <rect x="68" y="70" width="40" height="16" rx="8" fill="#06b6d4" />

  <rect x="20" y="92" width="40" height="16" rx="8" fill="#6366f1" opacity="0.7" />
  <rect x="68" y="92" width="40" height="16" rx="8" fill="#1e1b4b" stroke="#312e81" stroke-width="1.5" />
</svg>
